name: Build AltarKits

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Show repo files
        run: find . -name pom.xml -not -path "./.git/*"; ls -R | head -40

      - name: Build with Maven
        run: mvn -B package -f "$(find . -name pom.xml -not -path './.git/*' | head -1)"

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: AltarKits
          path: "**/target/AltarKits-*.jar"
